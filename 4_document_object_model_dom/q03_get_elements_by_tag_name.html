<!DOCTYPE html>
<html>
<head>
    <title>getElementsByTagName Demo</title>
</head>
<body>
    <p>Paragraph One</p>
    <p>Paragraph Two</p>
    <div>This is a div</div>

    <script type="text/javascript">
        // Returns live HTMLCollection
        const paragraphs = document.getElementsByTagName("p");
        document.write("<h2>getElementsByTagName Result:</h2>");
        document.write("<p>Total paragraphs: " + paragraphs.length + "</p>");
        for(let p of paragraphs) {
            document.write("<p>→ " + p.innerText + "</p>");
            p.style.color = "green";
        }
    </script>
</body>
</html>
