<!DOCTYPE html>
<html>
<head>
    <title>Factors of a Number</title>
</head>
<body>
    <h2>Factors of a Number</h2>
    <script type="text/javascript">
        let n = parseInt(prompt("Enter the number to calculate factors"));
        document.write("<h3>Output:</h3>");
        document.write("The factors of the number are: ");
        for (let i = 1; i <= n; i++) {
            if (n % i == 0) {
                document.write(i + " ");
            }
        }
    </script>
</body>
</html>
