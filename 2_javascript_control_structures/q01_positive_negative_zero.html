<!DOCTYPE html>
<html>
<head>
    <title>Positive, Negative, or Zero</title>
</head>
<body>
    <h2>Check Positive, Negative, or Zero</h2>
    <script type="text/javascript">
        let a = parseInt(prompt("Enter the number to find positive, negative, or zero"));
        document.write("<h3>Output:</h3>");
        if (a > 0) {
            document.write("The given value is positive");
        } else if (a < 0) {
            document.write("The given value is negative");
        } else if (a == 0) {
            document.write("The given value is zero");
        } else {
            document.write("The given value is unknown");
        }
    </script>
</body>
</html>
