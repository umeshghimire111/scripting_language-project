<!DOCTYPE html>
<html>
<head>
    <title>Area of Rectangle (Function)</title>
</head>
<body>
    <h2>Program to Display the Area of the Rectangle</h2>
    <p><em>Function with No Arguments and Return Values</em></p>

    <script type="text/javascript">
        function getAreaOfRectangle() {
            var length = parseInt(prompt("Enter the length of the rectangle:"));
            var width = parseInt(prompt("Enter the width of the rectangle:"));
            return length * width;
        }

        var area = getAreaOfRectangle();
        document.write("<h3>Output:</h3>");
        document.write("The area of the rectangle is " + area);
    </script>
</body>
</html>
