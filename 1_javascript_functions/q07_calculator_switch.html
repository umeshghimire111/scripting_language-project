<!DOCTYPE html>
<html>
<head>
    <title>Calculator Using Switch Case (Function)</title>
</head>
<body>
    <h2>Calculator Program Using Switch Case</h2>
    <p><em>Function with Arguments and No Return Values</em></p>

    <script type="text/javascript">
        function calculator(num1, num2, operation) {
            document.write("<h3>Output:</h3>");
            switch (operation) {
                case '+':
                    document.write("Result: " + (num1 + num2));
                    break;
                case '-':
                    document.write("Result: " + (num1 - num2));
                    break;
                case '*':
                    document.write("Result: " + (num1 * num2));
                    break;
                case '/':
                    document.write("Result: " + (num1 / num2));
                    break;
                default:
                    document.write("Invalid operation.");
            }
        }

        var num1 = parseFloat(prompt("Enter the first number:"));
        var num2 = parseFloat(prompt("Enter the second number:"));
        var operation = prompt("Enter an operation (+, -, *, /):");
        calculator(num1, num2, operation);
    </script>
</body>
</html>
