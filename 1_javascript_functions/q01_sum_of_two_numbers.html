<!DOCTYPE html>
<html>
<head>
    <title>Sum of Two Numbers (Function)</title>
</head>
<body>
    <h2>Program to Display the Sum of Two Numbers</h2>
    <p><em>Function with No Arguments and No Return Values</em></p>

    <script type="text/javascript">
        function sumNumbers() {
            var num1 = parseInt(prompt("Enter the first number:"));
            var num2 = parseInt(prompt("Enter the second number:"));
            var sum = num1 + num2;
            document.write("<h3>Output:</h3>");
            document.write("The sum of " + num1 + " and " + num2 + " is " + sum);
        }

        // Call the function
        sumNumbers();
    </script>
</body>
</html>
