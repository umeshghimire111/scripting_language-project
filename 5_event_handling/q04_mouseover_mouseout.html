<!DOCTYPE html>
<html>
<head>
    <title>Mouse Over & Out</title>
</head>
<body>
    <h1>Hover Effect Demo</h1>

    <div id="box" style="width:200px; height:100px; background:lightblue; padding:20px;
          text-align:center; font-size:18px; cursor:pointer; border-radius:8px;">
        Hover over me
    </div>

    <div id="message" style="margin-top:20px; font-weight:bold;"></div>

    <script type="text/javascript">
        const box = document.getElementById("box");
        const message = document.getElementById("message");

        box.addEventListener("mouseover", function() {
            box.style.background = "yellow";
            message.innerHTML = "<p style='color:orange'> ✅ Mouseover event triggered!</p>";
        });

        box.addEventListener("mouseout", function() {
            box.style.background = "lightblue";
            message.innerHTML = "<p style='color:gray'> ⬅ Mouseout event triggered!</p>";
        });
    </script>
</body>
</html>
