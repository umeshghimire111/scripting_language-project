<!DOCTYPE html>
<html>
<head>
    <title>Event Object Demo</title>
</head>
<body>
    <h2>Event Object (e) Demo</h2>
    <p>Click on the box below and check the browser console (F12 → Console).</p>

    <div class="box" style="width: 300px; height: 150px; background-color: #4CAF50; color: white;
          display: flex; align-items: center; justify-content: center; font-size: 20px;
          margin: 20px 0; cursor: pointer; border-radius: 10px;">
        Click Me!
    </div>

    <script type="text/javascript">
        const box = document.querySelector('.box');
        box.addEventListener('click', function(event) {
            console.log("=== Event Object Properties ===");
            console.log("event.type:", event.type);
            console.log("event.target:", event.target);
            console.log("event.currentTarget:", event.currentTarget);

            event.target.style.backgroundColor = "orange";
            event.target.textContent = "Clicked! 🎉";

            setTimeout(() => {
                event.target.style.backgroundColor = "#4CAF50";
                event.target.textContent = "Click Me!";
            }, 1500);
        });
    </script>
</body>
</html>
