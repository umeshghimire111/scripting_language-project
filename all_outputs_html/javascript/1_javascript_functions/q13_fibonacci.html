<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series (Function)</title>
</head>
<body>
    <h2>Program to Display Fibonacci Series</h2>
    <p><em>Function with Arguments and No Return Values</em></p>

    <script type="text/javascript">
        function fibonacci(n) {
            var a = 0, b = 1, nextTerm;
            document.write("<h3>Output:</h3>");
            document.write("Fibonacci Series: " + a + ", " + b);
            for (var i = 1; i <= n - 2; i++) {
                nextTerm = a + b;
                document.write(", " + nextTerm);
                a = b;
                b = nextTerm;
            }
        }

        var n = parseInt(prompt("Enter the number of terms:"));
        fibonacci(n);
    </script>
</body>
</html>
