<!DOCTYPE html>
<html>
<head>
    <title>Factors of a Number (Function)</title>
</head>
<body>
    <h2>Program to Display Factors of a Number</h2>
    <p><em>Function with Arguments and Return Values</em></p>

    <script type="text/javascript">
        function getFactors(num) {
            var factors = [];
            for (var i = 1; i <= num; i++) {
                if (num % i === 0) {
                    factors.push(i);
                }
            }
            return factors;
        }

        var number = parseInt(prompt("Enter a number:"));
        var factors = getFactors(number);
        document.write("<h3>Output:</h3>");
        document.write("The factors of " + number + " are: " + factors.join(', '));
    </script>
</body>
</html>
