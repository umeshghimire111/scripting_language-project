<!DOCTYPE html>
<html>
<head>
    <title>History Object Demo</title>
</head>
<body>
    <h2>History Object Properties & Methods</h2>

    <script type="text/javascript">
        document.write("<h3>Browser History Stack:</h3>");
        document.write("history.length: " + history.length + "<br>");
        document.write("history.state: " + history.state + "<br><br>");
    </script>

    <button onclick="history.back()">history.back()</button>
    <button onclick="history.forward()">history.forward()</button>
</body>
</html>
