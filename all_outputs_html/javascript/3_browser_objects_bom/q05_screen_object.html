<!DOCTYPE html>
<html>
<head>
    <title>Screen Object Demo</title>
</head>
<body>
    <h2>Screen Object Properties</h2>

    <script type="text/javascript">
        document.write("<h3>Screen Information:</h3>");
        document.write("screen.width: " + screen.width + " px<br>");
        document.write("screen.height: " + screen.height + " px<br>");
        document.write("screen.availWidth: " + screen.availWidth + " px<br>");
        document.write("screen.availHeight: " + screen.availHeight + " px<br>");
        document.write("screen.colorDepth: " + screen.colorDepth + " bits<br>");
        document.write("screen.pixelDepth: " + screen.pixelDepth + " bits<br>");
    </script>
</body>
</html>
