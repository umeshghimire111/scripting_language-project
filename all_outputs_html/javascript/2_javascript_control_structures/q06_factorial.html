<!DOCTYPE html>
<html>
<head>
    <title>Factorial</title>
</head>
<body>
    <h2>Factorial of a Number</h2>
    <script type="text/javascript">
        let f = 1;
        let n = parseInt(prompt("Enter the number to calculate factorial"));
        for (let i = 1; i <= n; i++) {
            f = f * i;
        }
        document.write("<h3>Output:</h3>");
        document.write("The factorial is = " + f + "<br>");
    </script>
</body>
</html>
