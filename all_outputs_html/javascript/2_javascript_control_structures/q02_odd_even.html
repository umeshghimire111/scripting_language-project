<!DOCTYPE html>
<html>
<head>
    <title>Odd or Even</title>
</head>
<body>
    <h2>Check Odd or Even Number</h2>
    <script type="text/javascript">
        let a = parseInt(prompt("Enter the number to check"));
        document.write("<h3>Output:</h3>");
        if (a > 0) {
            if (a % 2 == 0) {
                document.write("The given value is even");
            } else {
                document.write("The given value is odd");
            }
        } else {
            document.write("The value is not acceptable");
        }
    </script>
</body>
</html>
