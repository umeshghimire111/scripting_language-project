<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>
    <h2>Multiplication Table</h2>
    <script type="text/javascript">
        let a = parseInt(prompt("Enter the number"));
        document.write("<h3>Output:</h3>");
        for (let i = 1; i <= 10; i++) {
            let mul = a * i;
            document.write(a + " X " + i + " = " + mul + "<br>");
        }
    </script>
</body>
</html>
