<!DOCTYPE html>
<html>
<head>
    <title>Cookie Example</title>
</head>
<body>
    <h2>Cookie Operations</h2>
    <button onclick="createCookie()">Create Cookie</button>
    <button onclick="showCookie()">Show Cookie</button>
    <button onclick="deleteCookie()">Delete Cookie</button>
    <p id="result"></p>

    <script type="text/javascript">
        function createCookie() {
            document.cookie = "username :  Umesh Ghimire ; max-age=02";
            document.getElementById("result").innerHTML = "Loadig.......<br><b>Cookie Created (Valid for 60 seconds)";
        }

        function showCookie() {
            document.getElementById("result").innerHTML = "Cookie Data: " + document.cookie;
        }

        function deleteCookie() {
            document.cookie = "username = ; expires=Thu , 01 Jan 1970 00:00:00 UTC";
            document.getElementById("result").innerHTML = "Cookie Deleted";
        }
    </script>
</body> 
</html>
